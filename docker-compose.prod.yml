name: seguimiento-contrapartes

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      TZ: America/Bogota
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    image: seguimiento-contrapartes-backend-migrate:latest
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    image: seguimiento-contrapartes-backend:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - uploads_data:/app/uploads
      - ${EXTERNAL_ARRIENDOS_WORKBOOK_DIR:-./workbooks/arriendos}:/app/workbooks/arriendos
      - ${EXTERNAL_COLOCADORES_WORKBOOK_DIR:-./workbooks/colocadores}:/app/workbooks/colocadores
      - ${EXTERNAL_CLIENTES_WORKBOOK_DIR:-./workbooks/clientes}:/app/workbooks/clientes
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: seguimiento-contrapartes-frontend:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
